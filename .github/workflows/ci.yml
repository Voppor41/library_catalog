name: CI

on:
  push:
    branches:
      - main
      - feature/submit
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - run: pip install poetry
      - run: poetry install --no-root
      - run: poetry run ruff check src tests
      - run: poetry run pytest -q
        env:
          DEBUG: "false"
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/library_catalog
          JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
          CACHE_ENABLED: "false"
